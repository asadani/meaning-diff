[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meaning-diff"
version = "0.1.0"
description = "Inspect consequential changes in rewritten text."
requires-python = ">=3.11"
authors = [{name = "Anuj Sadani"}]
readme = "README.md"
license = {text = "MIT"}
dependencies = []

[project.scripts]
meaning-diff = "meaning_diff.__main__:main"

[tool.setuptools.packages.find]
include = ["meaning_diff*"]

[tool.setuptools.package-data]
"*" = ["web/*.css", "web/*.js", "assets/*.css", "assets/*.js", "*.css", "*.js", "*.json"]
